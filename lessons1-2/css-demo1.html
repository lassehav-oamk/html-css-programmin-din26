<!DOCTYPE html>
<html>
    <head>
        <style>
            p {
                color: green;
                background-color: pink;
                padding-top: 10px;
                padding-bottom: 20px;
                padding-left: 30px;
                padding-right: 50px;
                border: 2px solid black;
                border-bottom-width: 10px;
                border-top-color: yellow;
                border-bottom-style: double;
            }

            h1 {
                color: red;
                background-color: #1cb789;
            }

            #test {
                font-size: 30px;
                background-color: aqua;
            }

            .dark {
                background-color: black;
                color: white
            }
            
        </style>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>CSS demo</h1>
        <p style="color: green">This is a css demo</p>
        <p style="color: green">Second paragraph with some text</p>
        <p class="dark">Third paragraph with some text also</p>
        <p id="test" class="dark">Fourth parag</p>
        <p class="dark">Something more</p>

        <div class="box"></div>
        <div class="box"></div>
        
    </body>
</html>
