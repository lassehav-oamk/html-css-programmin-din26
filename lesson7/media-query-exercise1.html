<!DOCTYPE html>
<html>
    <head>
        <style>
            .box {
                width: 300px;
                border: 1px solid black;
                margin: 20px;
                
            }

            .container {
                display: flex;
                align-items: stretch;
                height: 600px;
                width: 1100px;
            }

            .box1 {
                background-color: black;
            }

            .box2 {
                background-color: red;
            }

            .box3 {
                background-color: yellow;
            }

            #nospace {
                display: none;
            }

            @media (max-width: 1025px)
            {
                .box3 {
                    display: none;
                }
            }

            @media (max-width: 690px) {
                .box2 {
                    display: none;
                }
            }

            @media (max-width: 500px) {
                .container {
                    display: none;
                }

                #nospace {
                    display: block;
                }
            }
        </style>
    </head>
    <body>
        <h1>Media query exercise</h1>
        <h2>Three columns side by side, each on disappears as window size decreases and the column no longer fits to screen.</h2>

        <div class="container">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
        </div>
        <div id="nospace">
            Nothing fits
        </div>
    </body>
</html>
