<!DOCTYPE html>
<html>
    <head>

        <style>
            .flexbox {
                display: flex;
                border: 1px dashed black;
            }

            .box {
                background-color: lightblue;
                padding: 30px;
                width: 100px;
                height: 100px;
                margin: 15px;
            }
        </style>
    </head>
    <body>
        <h1>Flexbox demo</h1>
        <div class="flexbox">
            <div class="box">a</div>
            <div class="box">b</div>
            <div class="box">c</div>
        </div>
    </body>
</html>
